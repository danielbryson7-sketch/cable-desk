name: Refresh and publish Cable Desk

on:
  push:
    branches: [main]
  schedule:
    # Each pair covers New York daylight and standard time. The updater gates
    # writes by the actual New York hour, so only the matching run records a checkpoint.
    - cron: "5 4,5 * * 1-5"    # 00:05 New York — freeze Asia + forecast
    - cron: "5 9,10 * * 1-5"   # 05:05 New York — record London
    - cron: "5 14,15 * * 1-5"  # 10:05 New York — record New York AM
    - cron: "15 20,21 * * 1-5" # 16:15 New York — grade the day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh market briefing
        run: python3 scripts/update_market.py
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh daily GBPUSD briefing"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
